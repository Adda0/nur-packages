name: Update packages
on:
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Bumped by hand: telescope stamps a release build number and commit, atuin-desktop has a per-system
        # node_modules hash nix-update does not refresh.
        package: [pinepods, pinepods-firewood, rimstack, rmrfrs, workshop-walker, zonetimeline-tui]
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: nix-update
        run: |
          # The update recipe commits what it bumps; give it an author.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before=$(git rev-parse HEAD)
          nix develop --command just update ${{ matrix.package }}
          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            echo "UPDATED=1" >> "$GITHUB_ENV"
            echo "TITLE=$(git log -1 --format=%s)" >> "$GITHUB_ENV"
          fi
      # A PAT/App token, not GITHUB_TOKEN: pushes made with GITHUB_TOKEN do not trigger the Build workflow.
      - uses: peter-evans/create-pull-request@v7
        if: env.UPDATED == '1'
        with:
          token: ${{ secrets.UPDATE_TOKEN }}
          branch: update/${{ matrix.package }}
          title: ${{ env.TITLE }}
          delete-branch: true
